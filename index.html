<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منوی کافه | سفارش میز و بیرون‌بر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --surface-soft: #efeae2;
      --text: #1f1b18;
      --muted: #6c635b;
      --accent: #7c4d2b;
      --accent-dark: #5c371d;
      --accent-soft: #f3e8de;
      --border: #e4dcd1;
      --success: #2e7d5b;
      --danger: #b83b3b;
      --shadow: 0 10px 30px rgba(31, 27, 24, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      padding-bottom: 92px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 32px;
    }

    header {
      background: linear-gradient(135deg, #2b211b 0%, #4b3222 100%);
      color: #fff;
      border-radius: 24px;
      padding: 26px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand h1 { font-size: 1.65rem; font-weight: 700; }
    .brand p { color: #e6d8cb; font-size: 0.92rem; margin-top: 4px; }

    .status-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #f7efe8;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }

    .card.unavailable { opacity: 0.62; }

    .thumb-wrap {
      position: relative;
      height: 175px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(31, 27, 24, 0.82);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .stock-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fff;
    }

    .stock-tag.in { color: var(--success); }
    .stock-tag.out { color: var(--danger); }

    .card-body {
      padding: 15px 16px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title { font-size: 1.05rem; font-weight: 700; }

    .card-price {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--accent-dark);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .card-cat { font-size: 0.78rem; color: var(--muted); }
    .card-desc { font-size: 0.88rem; color: var(--muted); flex: 1; }

    .add-btn {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }

    .add-btn:disabled { background: #b5aba2; cursor: not-allowed; }

    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #231b16;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      z-index: 40;
    }

    .cart-bar button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }

    .modal {
      background: var(--surface);
      color: var(--text);
      width: 100%;
      max-width: 480px;
      border-radius: 22px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }

    .modal h3 { font-size: 1.15rem; margin-bottom: 12px; }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.88rem;
    }

    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-controls button {
      width: 26px; height: 26px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .type-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .type-btn {
      padding: 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .type-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .field { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.82rem; color: var(--muted); }
    .field input, .field select {
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      font-family: inherit;
      font-size: 0.9rem;
      background: #fff;
    }

    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .submit-order {
      flex: 1;
      padding: 11px;
      border-radius: 12px;
      border: none;
      background: var(--success);
      color: #fff;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    .close-modal {
      padding: 11px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-soft);
      font-family: inherit;
      cursor: pointer;
    }

    .state-box {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .refresh-btn {
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 12px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">
          <h1>کافه گرم</h1>
          <p>سفارش داخل سالن (میز) یا بیرون‌بر با کد پیگیری سریع</p>
        </div>
        <div class="status-pill" id="syncStatus">در حال دریافت منو...</div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجو در منو (مثلاً لاته، سرد، کیک...)" />
      </div>
      <div class="categories" id="categoryBar"></div>
    </div>

    <main id="menuContainer" class="grid"></main>
  </div>

  <div class="cart-bar">
    <div>
      <div id="cartSummaryText" style="font-size: 0.9rem; font-weight: 700;">سبد سفارش خالی است</div>
      <div id="cartTotalText" style="font-size: 0.78rem; color: #dfd2c6;">جمع کل: ۰ تومان</div>
    </div>
    <button onclick="openCartModal()">ثبت سفارش</button>
  </div>

  <div class="modal-backdrop" id="cartModal">
    <div class="modal">
      <h3>تکمیل و ثبت سفارش</h3>
      <div id="cartItemsList"></div>

      <div class="type-switch">
        <button type="button" class="type-btn active" id="typeTableBtn" onclick="setOrderType('table')">سفارش میز</button>
        <button type="button" class="type-btn" id="typeTakeawayBtn" onclick="setOrderType('takeaway')">بیرون‌بر</button>
      </div>

      <div class="field" id="tableField">
        <label>شماره میز را انتخاب کنید</label>
        <select id="tableSelect"></select>
      </div>

      <div class="field" id="phoneField" style="display: none;">
        <label>شماره تماس برای اطلاع‌رسانی کد بیرون‌بر</label>
        <input type="tel" id="phoneInput" placeholder="مثلاً 09123456789" />
      </div>

      <div style="margin-top: 12px; font-weight: 700; display: flex; justify-content: space-between;">
        <span>مبلغ قابل پرداخت:</span>
        <span id="modalTotal">۰ تومان</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="submit-order" id="confirmOrderBtn" onclick="submitOrder()">ارسال سفارش</button>
        <button type="button" class="close-modal" onclick="closeCartModal()">بستن</button>
      </div>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFsaobIG923NwUUNrVzTjgerUlLOEC-YM1CjAIhoDUDfxUDs22-_VLapxUZ_L9SmQ/exec";
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=70";

    let allItems = [];
    let selectedCategory = "همه";
    let tableCount = 10;
    let cart = [];
    let orderType = "table";

    const menuContainer = document.getElementById("menuContainer");
    const categoryBar = document.getElementById("categoryBar");
    const searchInput = document.getElementById("searchInput");
    const syncStatus = document.getElementById("syncStatus");

    function formatPrice(num) {
      return (Number(num) || 0).toLocaleString("fa-IR") + " تومان";
    }

    function renderTableSelect() {
      const sel = document.getElementById("tableSelect");
      if (tableCount <= 0) {
        sel.innerHTML = `<option value="">میزی تعریف نشده</option>`;
        return;
      }
      let opts = "";
      for (let i = 1; i <= tableCount; i++) {
        opts += `<option value="میز ${i}">میز ${i}</option>`;
      }
      sel.innerHTML = opts;
    }

    function renderCategories() {
      const cats = ["همه", ...new Set(allItems.map(i => i.category).filter(Boolean))];
      categoryBar.innerHTML = cats.map(cat => `
        <button class="cat-btn ${cat === selectedCategory ? "active" : ""}" data-cat="${cat}">
          ${cat}
        </button>
      `).join("");

      categoryBar.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCategory = btn.dataset.cat;
          renderCategories();
          renderMenu();
        });
      });
    }

    function renderMenu() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        const matchCat = selectedCategory === "همه" || item.category === selectedCategory;
        const matchText = !q ||
          (item.name && item.name.toLowerCase().includes(q)) ||
          (item.desc && item.desc.toLowerCase().includes(q)) ||
          (item.category && item.category.toLowerCase().includes(q));
        return matchCat && matchText;
      });

      if (!filtered.length) {
        menuContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            آیتمی با این مشخصات پیدا نشد.
          </div>
        `;
        return;
      }

      menuContainer.innerHTML = filtered.map(item => {
        const isAvailable = Boolean(item.available);
        const imgSrc = item.image && item.image.trim() ? item.image.trim() : DEFAULT_IMG;
        return `
          <article class="card ${isAvailable ? "" : "unavailable"}">
            <div class="thumb-wrap">
              <img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.src='${DEFAULT_IMG}'" />
              ${item.badge ? `<span class="badge">${item.badge}</span>` : ""}
              <span class="stock-tag ${isAvailable ? "in" : "out"}">
                ${isAvailable ? "موجود" : "ناموجود"}
              </span>
            </div>
            <div class="card-body">
              <div class="card-cat">${item.category || "عمومی"}</div>
              <div class="card-head">
                <h2 class="card-title">${item.name}</h2>
                <span class="card-price">${formatPrice(item.price)}</span>
              </div>
              <p class="card-desc">${item.desc || ""}</p>
              <button class="add-btn" ${isAvailable ? "" : "disabled"} onclick="addToCart('${item.id}')">
                ${isAvailable ? "افزودن به سفارش" : "ناموجود"}
              </button>
            </div>
          </article>
        `;
      }).join("");
    }

    function addToCart(id) {
      const prod = allItems.find(x => String(x.id) === String(id));
      if (!prod || !prod.available) return;
      const found = cart.find(c => String(c.id) === String(id));
      if (found) found.qty += 1;
      else cart.push({ id: prod.id, name: prod.name, price: Number(prod.price) || 0, qty: 1 });
      updateCartBar();
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex(c => String(c.id) === String(id));
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartBar();
      renderCartModal();
    }

    function updateCartBar() {
      const count = cart.reduce((s, x) => s + x.qty, 0);
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById("cartSummaryText").textContent = count ? `${count} قلم در سفارش` : "سبد سفارش خالی است";
      document.getElementById("cartTotalText").textContent = `جمع کل: ${formatPrice(total)}`;
    }

    function openCartModal() {
      if (!cart.length) {
        alert("ابتدا حداقل یک آیتم به سفارش اضافه کنید.");
        return;
      }
      renderCartModal();
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById("typeTableBtn").classList.toggle("active", type === "table");
      document.getElementById("typeTakeawayBtn").classList.toggle("active", type === "takeaway");
      document.getElementById("tableField").style.display = type === "table" ? "flex" : "none";
      document.getElementById("phoneField").style.display = type === "takeaway" ? "flex" : "none";
    }

    function renderCartModal() {
      const list = document.getElementById("cartItemsList");
      list.innerHTML = cart.map(c => `
        <div class="cart-item">
          <div>
            <strong>${c.name}</strong>
            <div style="font-size: 0.78rem; color: var(--muted);">${formatPrice(c.price * c.qty)}</div>
          </div>
          <div class="qty-controls">
            <button onclick="changeQty('${c.id}', 1)">+</button>
            <span>${c.qty}</span>
            <button onclick="changeQty('${c.id}', -1)">-</button>
          </div>
        </div>
      `).join("");
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById("modalTotal").textContent = formatPrice(total);
    }

    async function submitOrder() {
      const btn = document.getElementById("confirmOrderBtn");
      const tableNumber = document.getElementById("tableSelect").value;
      const phone = document.getElementById("phoneInput").value.trim();

      if (orderType === "table" && !tableNumber) {
        alert("لطفاً شماره میز را انتخاب کنید.");
        return;
      }
      if (orderType === "takeaway" && !phone) {
        alert("لطفاً شماره تماس برای سفارش بیرون‌بر را وارد کنید.");
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "create_order",
            order_type: orderType,
            table_number: orderType === "table" ? tableNumber : "",
            phone: orderType === "takeaway" ? phone : "",
            items: cart
          })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "خطا در ثبت سفارش");

        const code = data.order.order_code;
        if (orderType === "takeaway") {
          alert(`سفارش بیرون‌بر ثبت شد!\nکد پیگیری شما: ${code}\nشماره ثبت‌شده: ${phone}`);
        } else {
          alert(`سفارش شما برای ${tableNumber} ارسال شد.\nکد سفارش: ${code}`);
        }

        cart = [];
        updateCartBar();
        closeCartModal();
      } catch (err) {
        alert("خطا: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadMenu() {
      syncStatus.textContent = "در حال بروزرسانی...";
      menuContainer.innerHTML = `
        <div class="state-box" style="grid-column: 1 / -1;">
          در حال بارگذاری منو از گوگل شیت...
        </div>
      `;

      try {
        const res = await fetch(`${APPS_SCRIPT_URL}?type=menu`, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "خطا در دریافت اطلاعات");

        allItems = Array.isArray(data.items) ? data.items : [];
        tableCount = Number(data.table_count ?? 10);
        renderTableSelect();
        syncStatus.textContent = `بروزرسانی شد (${allItems.length} آیتم)`;
        renderCategories();
        renderMenu();
      } catch (err) {
        syncStatus.textContent = "خطا در اتصال";
        menuContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            <p>نتونستیم منو رو لود کنیم: ${err.message}</p>
            <button class="refresh-btn" onclick="loadMenu()">تلاش مجدد</button>
          </div>
        `;
      }
    }

    searchInput.addEventListener("input", renderMenu);
    loadMenu();
  </script>
</body>
</html>
