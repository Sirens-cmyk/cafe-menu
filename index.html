<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منوی کافه | سفارش میز و بیرون‌بر</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f2ec;
      --surface: #ffffff;
      --surface-soft: #efe9e0;
      --text: #1f1a17;
      --muted: #6e645b;
      --accent: #7c4d2b;
      --accent-dark: #5b361c;
      --accent-soft: #f4e8dd;
      --border: #e4dbd0;
      --ok: #257a55;
      --bad: #b83b3b;
      --radius: 18px;
      --shadow: 0 10px 28px rgba(31, 26, 23, 0.06);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      padding-bottom: 96px;
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 18px 14px; }
    header {
      background: linear-gradient(135deg, #271e18 0%, #4d3322 100%);
      color: #fff;
      border-radius: 24px;
      padding: 24px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { color: #e8d8ca; font-size: 0.9rem; margin-top: 4px; }
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 18px; }
    .search-box input {
      width: 100%;
      padding: 12px 15px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.94rem;
      outline: none;
    }
    .search-box input:focus { border-color: var(--accent); }
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 15px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(275px, 1fr)); gap: 15px; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
    }
    .card.unavailable { opacity: 0.6; }
    .thumb { position: relative; height: 170px; background: var(--surface-soft); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .badge {
      position: absolute; top: 10px; right: 10px;
      background: rgba(31, 26, 23, 0.84); color: #fff;
      font-size: 0.74rem; padding: 3px 10px; border-radius: 999px;
    }
    .stock {
      position: absolute; bottom: 10px; left: 10px;
      background: #fff; font-size: 0.74rem; font-weight: 600;
      padding: 3px 9px; border-radius: 999px;
    }
    .stock.in { color: var(--ok); }
    .stock.out { color: var(--bad); }
    .card-body { padding: 14px 15px 16px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .card-cat { font-size: 0.76rem; color: var(--muted); }
    .card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
    .card-title { font-size: 1.02rem; font-weight: 700; }
    .card-price {
      background: var(--accent-soft); color: var(--accent-dark);
      font-weight: 700; font-size: 0.88rem; padding: 3px 10px;
      border-radius: 10px; white-space: nowrap;
    }
    .card-desc { font-size: 0.86rem; color: var(--muted); flex: 1; }
    .add-btn {
      margin-top: 4px;
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .add-btn:disabled { background: #b5aba2; cursor: not-allowed; }
    .cart-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #231b16;
      color: #fff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.16);
      z-index: 40;
    }
    .cart-bar button {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-backdrop {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal {
      background: var(--surface);
      color: var(--text);
      width: 100%;
      max-width: 480px;
      border-radius: 22px;
      padding: 20px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal h3 { font-size: 1.15rem; margin-bottom: 12px; }
    .cart-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem;
    }
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-controls button {
      width: 26px; height: 26px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface-soft); font-family: inherit; font-weight: 700; cursor: pointer;
    }
    .type-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
    .type-btn {
      padding: 10px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-soft); font-family: inherit; font-weight: 600; cursor: pointer;
    }
    .type-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .field { margin-top: 10px; display: flex; flex-direction: column; gap: 5px; }
    .field label { font-size: 0.82rem; color: var(--muted); }
    .field input, .field select {
      padding: 10px 12px; border-radius: 11px; border: 1px solid var(--border);
      font-family: inherit; font-size: 0.9rem; background: #fff;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
    .submit-order {
      flex: 1; padding: 11px; border-radius: 12px; border: none;
      background: var(--ok); color: #fff; font-family: inherit; font-weight: 700; cursor: pointer;
    }
    .close-modal {
      padding: 11px 16px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-soft); font-family: inherit; cursor: pointer;
    }
    .empty-box {
      grid-column: 1 / -1; text-align: center; padding: 40px 16px;
      background: var(--surface); border-radius: var(--radius); border: 1px dashed var(--border); color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>کافه گرم</h1>
      <p>سفارش داخل سالن (میز) یا بیرون‌بر با کد پیگیری سریع</p>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجو در منو (لاته، سرد، کیک...)" />
      </div>
      <div class="categories" id="categoryBar"></div>
    </div>

    <main id="menuGrid" class="grid">
      <div class="empty-box">در حال دریافت منو...</div>
    </main>
  </div>

  <div class="cart-bar">
    <div>
      <div id="cartSummaryText" style="font-size: 0.9rem; font-weight: 700;">سبد سفارش خالی است</div>
      <div id="cartTotalText" style="font-size: 0.78rem; color: #dfd2c6;">جمع کل: ۰ تومان</div>
    </div>
    <button onclick="openCartModal()">ثبت سفارش</button>
  </div>

  <div class="modal-backdrop" id="cartModal">
    <div class="modal">
      <h3>تکمیل و ثبت سفارش</h3>
      <div id="cartItemsList"></div>

      <div class="type-switch">
        <button type="button" class="type-btn active" id="typeTableBtn" onclick="setOrderType('table')">سفارش میز</button>
        <button type="button" class="type-btn" id="typeTakeawayBtn" onclick="setOrderType('takeaway')">بیرون‌بر</button>
      </div>

      <div class="field" id="tableField">
        <label>شماره میز را انتخاب کنید</label>
        <select id="tableSelect"></select>
      </div>

      <div class="field" id="phoneField" style="display: none;">
        <label>شماره تماس برای اطلاع‌رسانی کد بیرون‌بر</label>
        <input type="tel" id="phoneInput" placeholder="مثلاً 09123456789" />
      </div>

      <div style="margin-top: 12px; font-weight: 700; display: flex; justify-content: space-between;">
        <span>مبلغ قابل پرداخت:</span>
        <span id="modalTotal">۰ تومان</span>
      </div>

      <div class="modal-actions">
        <button type="button" class="submit-order" id="confirmOrderBtn" onclick="submitOrder()">ارسال سفارش</button>
        <button type="button" class="close-modal" onclick="closeCartModal()">بستن</button>
      </div>
    </div>
  </div>

  <script>
    // آدرس بک‌اند روی VPS خودت (بدون اسلش اضافه در انتها)
    // مثال: http://185.120.xx.xx:8010 یا https://api.yourdomain.com
    const API_BASE_URL = "http://94.184.45.64:8010";
    const FALLBACK_IMG = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=70";

    let items = [];
    let selectedCategory = "همه";
    let tableCount = 10;
    let cart = [];
    let orderType = "table";

    function resolveImg(url) {
      if (!url) return FALLBACK_IMG;
      if (url.startsWith("http://") || url.startsWith("https://")) return url;
      if (url.startsWith("/")) return API_BASE_URL + url;
      return API_BASE_URL + "/" + url;
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString("fa-IR") + " تومان";
    }

    async function initData() {
      try {
        const [menuRes, tablesRes] = await Promise.all([
          fetch(`${API_BASE_URL}/menu`, { cache: "no-store" }),
          fetch(`${API_BASE_URL}/settings/tables`, { cache: "no-store" }),
        ]);
        const menuData = await menuRes.json();
        const tablesData = await tablesRes.json();

        items = menuData.items || [];
        tableCount = Number(tablesData.table_count || 10);

        renderTableSelect();
        renderCategories();
        renderMenu();
      } catch (err) {
        document.getElementById("menuGrid").innerHTML = `
          <div class="empty-box">خطا در ارتباط با سرور: ${err.message}</div>
        `;
      }
    }

    function renderTableSelect() {
      const sel = document.getElementById("tableSelect");
      if (tableCount <= 0) {
        sel.innerHTML = `<option value="">میزی تعریف نشده</option>`;
        return;
      }
      let opts = "";
      for (let i = 1; i <= tableCount; i++) {
        opts += `<option value="میز ${i}">میز ${i}</option>`;
      }
      sel.innerHTML = opts;
    }

    function renderCategories() {
      const cats = ["همه", ...new Set(items.map(i => i.category).filter(Boolean))];
      const bar = document.getElementById("categoryBar");
      bar.innerHTML = cats.map(c => `
        <button class="cat-btn ${c === selectedCategory ? "active" : ""}" onclick="selectCat('${c.replace(/'/g, "\'")}')">${c}</button>
      `).join("");
    }

    function selectCat(c) {
      selectedCategory = c;
      renderCategories();
      renderMenu();
    }

    function renderMenu() {
      const q = document.getElementById("searchInput").value.trim().toLowerCase();
      const list = items.filter(i => {
        const okCat = selectedCategory === "همه" || i.category === selectedCategory;
        const okQ = !q || (i.name && i.name.toLowerCase().includes(q)) || (i.description && i.description.toLowerCase().includes(q));
        return okCat && okQ;
      });

      const grid = document.getElementById("menuGrid");
      if (!list.length) {
        grid.innerHTML = `<div class="empty-box">موردی یافت نشد.</div>`;
        return;
      }

      grid.innerHTML = list.map(i => `
        <article class="card ${i.available ? "" : "unavailable"}">
          <div class="thumb">
            <img src="${resolveImg(i.image)}" alt="${i.name}" loading="lazy" onerror="this.src='${FALLBACK_IMG}'" />
            ${i.badge ? `<span class="badge">${i.badge}</span>` : ""}
            <span class="stock ${i.available ? "in" : "out"}">${i.available ? "موجود" : "ناموجود"}</span>
          </div>
          <div class="card-body">
            <div class="card-cat">${i.category}</div>
            <div class="card-head">
              <h2 class="card-title">${i.name}</h2>
              <span class="card-price">${fmt(i.price)}</span>
            </div>
            <p class="card-desc">${i.description || ""}</p>
            <button class="add-btn" ${i.available ? "" : "disabled"} onclick="addToCart('${i.id}')">
              ${i.available ? "افزودن به سفارش" : "ناموجود"}
            </button>
          </div>
        </article>
      `).join("");
    }

    function addToCart(id) {
      const prod = items.find(x => x.id === id);
      if (!prod || !prod.available) return;
      const found = cart.find(c => c.id === id);
      if (found) found.qty += 1;
      else cart.push({ id: prod.id, name: prod.name, price: prod.price, qty: 1 });
      updateCartBar();
    }

    function changeQty(id, delta) {
      const idx = cart.findIndex(c => c.id === id);
      if (idx === -1) return;
      cart[idx].qty += delta;
      if (cart[idx].qty <= 0) cart.splice(idx, 1);
      updateCartBar();
      renderCartModal();
    }

    function updateCartBar() {
      const count = cart.reduce((s, x) => s + x.qty, 0);
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById("cartSummaryText").textContent = count ? `${count} قلم در سفارش` : "سبد سفارش خالی است";
      document.getElementById("cartTotalText").textContent = `جمع کل: ${fmt(total)}`;
    }

    function openCartModal() {
      if (!cart.length) {
        alert("ابتدا حداقل یک آیتم به سفارش اضافه کنید.");
        return;
      }
      renderCartModal();
      document.getElementById("cartModal").style.display = "flex";
    }

    function closeCartModal() {
      document.getElementById("cartModal").style.display = "none";
    }

    function setOrderType(type) {
      orderType = type;
      document.getElementById("typeTableBtn").classList.toggle("active", type === "table");
      document.getElementById("typeTakeawayBtn").classList.toggle("active", type === "takeaway");
      document.getElementById("tableField").style.display = type === "table" ? "flex" : "none";
      document.getElementById("phoneField").style.display = type === "takeaway" ? "flex" : "none";
    }

    function renderCartModal() {
      const list = document.getElementById("cartItemsList");
      list.innerHTML = cart.map(c => `
        <div class="cart-item">
          <div>
            <strong>${c.name}</strong>
            <div style="font-size: 0.78rem; color: var(--muted);">${fmt(c.price * c.qty)}</div>
          </div>
          <div class="qty-controls">
            <button onclick="changeQty('${c.id}', 1)">+</button>
            <span>${c.qty}</span>
            <button onclick="changeQty('${c.id}', -1)">-</button>
          </div>
        </div>
      `).join("");
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById("modalTotal").textContent = fmt(total);
    }

    async function submitOrder() {
      const btn = document.getElementById("confirmOrderBtn");
      const tableNumber = document.getElementById("tableSelect").value;
      const phone = document.getElementById("phoneInput").value.trim();

      if (orderType === "table" && !tableNumber) {
        alert("لطفاً شماره میز را انتخاب کنید.");
        return;
      }
      if (orderType === "takeaway" && !phone) {
        alert("لطفاً شماره تماس برای سفارش بیرون‌بر را وارد کنید.");
        return;
      }

      btn.disabled = true;
      try {
        const res = await fetch(`${API_BASE_URL}/orders`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            order_type: orderType,
            table_number: orderType === "table" ? tableNumber : "",
            phone: orderType === "takeaway" ? phone : "",
            items: cart,
          }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.detail || "خطا در ثبت سفارش");

        const code = data.order.order_code;
        if (orderType === "takeaway") {
          alert(`سفارش بیرون‌بر ثبت شد!\nکد پیگیری شما: ${code}\nشماره ثبت‌شده: ${phone}`);
        } else {
          alert(`سفارش شما برای ${tableNumber} ارسال شد.\nکد سفارش: ${code}`);
        }

        cart = [];
        updateCartBar();
        closeCartModal();
      } catch (err) {
        alert("خطا: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById("searchInput").addEventListener("input", renderMenu);
    initData();
  </script>
</body>
</html>
