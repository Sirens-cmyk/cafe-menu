<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>منوی کافه | نسخه زنده</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f3ee;
      --surface: #ffffff;
      --surface-soft: #efeae2;
      --text: #1f1b18;
      --muted: #6c635b;
      --accent: #7c4d2b;
      --accent-dark: #5c371d;
      --accent-soft: #f3e8de;
      --border: #e4dcd1;
      --success: #2e7d5b;
      --danger: #b83b3b;
      --shadow: 0 10px 30px rgba(31, 27, 24, 0.06);
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 20px 16px 64px;
    }

    header {
      background: linear-gradient(135deg, #2b211b 0%, #4b3222 100%);
      color: #fff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .brand h1 {
      font-size: 1.65rem;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .brand p {
      color: #e6d8cb;
      font-size: 0.92rem;
      margin-top: 4px;
    }

    .status-pill {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      color: #f7efe8;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 22px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--accent);
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories::-webkit-scrollbar { display: none; }

    .cat-btn {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card.unavailable {
      opacity: 0.62;
    }

    .thumb-wrap {
      position: relative;
      height: 175px;
      background: var(--surface-soft);
      overflow: hidden;
    }

    .thumb-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .badge {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(31, 27, 24, 0.82);
      color: #fff;
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .stock-tag {
      position: absolute;
      bottom: 10px;
      left: 10px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fff;
    }

    .stock-tag.in { color: var(--success); }
    .stock-tag.out { color: var(--danger); }

    .card-body {
      padding: 15px 16px 16px;
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 8px;
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .card-price {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent-dark);
      background: var(--accent-soft);
      padding: 3px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .card-cat {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      flex: 1;
    }

    .state-box {
      text-align: center;
      padding: 48px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .refresh-btn {
      margin-top: 12px;
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 9px 18px;
      border-radius: 12px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-top">
        <div class="brand">
          <h1>کافه گرم</h1>
          <p>قهوه تخصصی، نوشیدنی‌های تازه و عصرانه‌های خوش‌طعم</p>
        </div>
        <div class="status-pill" id="syncStatus">در حال دریافت منو...</div>
      </div>
    </header>

    <div class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="جستجو در منو (مثلاً لاته، سرد، کیک...)" />
      </div>
      <div class="categories" id="categoryBar"></div>
    </div>

    <main id="menuContainer" class="grid"></main>
  </div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFsaobIG923NwUUNrVzTjgerUlLOEC-YM1CjAIhoDUDfxUDs22-_VLapxUZ_L9SmQ/exec";
    const DEFAULT_IMG = "https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=800&q=70";

    let allItems = [];
    let selectedCategory = "همه";

    const menuContainer = document.getElementById("menuContainer");
    const categoryBar = document.getElementById("categoryBar");
    const searchInput = document.getElementById("searchInput");
    const syncStatus = document.getElementById("syncStatus");

    function formatPrice(num) {
      const n = Number(num) || 0;
      return n.toLocaleString("fa-IR") + " تومان";
    }

    function renderCategories() {
      const cats = ["همه", ...new Set(allItems.map(i => i.category).filter(Boolean))];
      categoryBar.innerHTML = cats.map(cat => `
        <button class="cat-btn ${cat === selectedCategory ? "active" : ""}" data-cat="${cat}">
          ${cat}
        </button>
      `).join("");

      categoryBar.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCategory = btn.dataset.cat;
          renderCategories();
          renderMenu();
        });
      });
    }

    function renderMenu() {
      const q = searchInput.value.trim().toLowerCase();
      const filtered = allItems.filter(item => {
        const matchCat = selectedCategory === "همه" || item.category === selectedCategory;
        const matchText = !q ||
          (item.name && item.name.toLowerCase().includes(q)) ||
          (item.desc && item.desc.toLowerCase().includes(q)) ||
          (item.category && item.category.toLowerCase().includes(q));
        return matchCat && matchText;
      });

      if (!filtered.length) {
        menuContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            آیتمی با این مشخصات پیدا نشد.
          </div>
        `;
        return;
      }

      menuContainer.innerHTML = filtered.map(item => {
        const isAvailable = Boolean(item.available);
        const imgSrc = item.image && item.image.trim() ? item.image.trim() : DEFAULT_IMG;
        return `
          <article class="card ${isAvailable ? "" : "unavailable"}">
            <div class="thumb-wrap">
              <img src="${imgSrc}" alt="${item.name}" loading="lazy" onerror="this.src='${DEFAULT_IMG}'" />
              ${item.badge ? `<span class="badge">${item.badge}</span>` : ""}
              <span class="stock-tag ${isAvailable ? "in" : "out"}">
                ${isAvailable ? "موجود" : "ناموجود"}
              </span>
            </div>
            <div class="card-body">
              <div class="card-cat">${item.category || "عمومی"}</div>
              <div class="card-head">
                <h2 class="card-title">${item.name}</h2>
                <span class="card-price">${formatPrice(item.price)}</span>
              </div>
              <p class="card-desc">${item.desc || ""}</p>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadMenu() {
      syncStatus.textContent = "در حال بروزرسانی...";
      menuContainer.innerHTML = `
        <div class="state-box" style="grid-column: 1 / -1;">
          در حال بارگذاری منو از دیتابیس...
        </div>
      `;

      try {
        const res = await fetch(APPS_SCRIPT_URL, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "خطا در دریافت اطلاعات");

        allItems = Array.isArray(data.items) ? data.items : [];
        syncStatus.textContent = `بروزرسانی شد (${allItems.length} آیتم)`;
        renderCategories();
        renderMenu();
      } catch (err) {
        syncStatus.textContent = "خطا در اتصال";
        menuContainer.innerHTML = `
          <div class="state-box" style="grid-column: 1 / -1;">
            <p>نتونستیم منو رو لود کنیم: ${err.message}</p>
            <button class="refresh-btn" onclick="loadMenu()">تلاش مجدد</button>
          </div>
        `;
      }
    }

    searchInput.addEventListener("input", renderMenu);
    loadMenu();
  </script>
</body>
</html>
