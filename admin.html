<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>پنل مدیریت منو</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #141210;
      --card: #1e1b18;
      --card-2: #282420;
      --text: #f5f0ea;
      --muted: #a69c92;
      --accent: #c47d43;
      --border: #332d27;
      --ok: #38a169;
      --warn: #d69e2e;
      --bad: #e53e3e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Vazirmatn', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding: 20px 14px 60px;
    }

    .wrap { max-width: 1060px; margin: 0 auto; }

    .login-box {
      max-width: 380px;
      margin: 80px auto;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 26px;
      text-align: center;
    }

    .login-box h2 { margin-bottom: 8px; font-size: 1.25rem; }
    .login-box p { color: var(--muted); font-size: 0.88rem; margin-bottom: 18px; }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 22px;
    }

    .panel h3 { margin-bottom: 14px; font-size: 1.05rem; }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 12px;
    }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 0.82rem; color: var(--muted); }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--card-2);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--accent); }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 10px 16px;
      font-family: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: #fff; }
    .btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--border); }
    .btn-ok { background: rgba(56, 161, 105, 0.18); color: #68d391; }
    .btn-warn { background: rgba(214, 158, 46, 0.18); color: #f6e05e; }
    .btn-bad { background: rgba(229, 62, 62, 0.18); color: #fc8181; }

    .table-wrap { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 680px;
    }

    th, td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: right;
      font-size: 0.88rem;
      vertical-align: middle;
    }

    th { color: var(--muted); font-weight: 600; }

    .pill {
      padding: 3px 9px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 600;
      display: inline-block;
    }

    .pill.on { background: rgba(56, 161, 105, 0.18); color: #68d391; }
    .pill.off { background: rgba(229, 62, 62, 0.18); color: #fc8181; }

    .row-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .row-btns button { padding: 6px 10px; font-size: 0.78rem; }

    .toast {
      position: fixed;
      bottom: 20px;
      left: 20px;
      background: var(--card-2);
      border: 1px solid var(--accent);
      color: var(--text);
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 0.86rem;
      z-index: 99;
      display: none;
    }
  </style>
</head>
<body>
  <div id="loginScreen" class="login-box">
    <h2>ورود به پنل مدیریت</h2>
    <p>رمز عبور مدیریت منو را وارد کنید</p>
    <input type="password" id="passInput" placeholder="رمز عبور" style="margin-bottom: 12px;" />
    <button class="btn-primary" style="width: 100%;" onclick="checkLogin()">ورود</button>
  </div>

  <div id="appScreen" class="wrap" style="display: none;">
    <div class="top-bar">
      <div>
        <h2>مدیریت آیتم‌های منو</h2>
        <span style="font-size: 0.82rem; color: var(--muted);" id="countInfo">در حال بارگذاری...</span>
      </div>
      <div style="display: flex; gap: 8px;">
        <button class="btn-ghost" onclick="fetchItems()">بروزرسانی لیست</button>
        <button class="btn-ghost" onclick="logout()">خروج</button>
      </div>
    </div>

    <div class="panel">
      <h3 id="formTitle">افزودن آیتم جدید</h3>
      <form id="itemForm">
        <input type="hidden" id="editId" />
        <div class="form-grid">
          <div class="field">
            <label>نام آیتم *</label>
            <input type="text" id="fName" required placeholder="مثلاً لاته فندق" />
          </div>
          <div class="field">
            <label>دسته‌بندی *</label>
            <input type="text" id="fCategory" list="catSuggestions" required placeholder="قهوه و اسپرسو" />
            <datalist id="catSuggestions">
              <option value="قهوه و اسپرسو">
              <option value="نوشیدنی سرد">
              <option value="کیک و دسر">
              <option value="صبحانه و میان‌وعده">
            </datalist>
          </div>
          <div class="field">
            <label>قیمت (تومان) *</label>
            <input type="number" id="fPrice" required min="0" placeholder="120000" />
          </div>
          <div class="field">
            <label>برچسب ویژه</label>
            <input type="text" id="fBadge" placeholder="پرفروش / جدید" />
          </div>
          <div class="field">
            <label>لینک عکس (اختیاری)</label>
            <input type="url" id="fImage" placeholder="https://..." />
          </div>
          <div class="field">
            <label>وضعیت موجودی</label>
            <select id="fAvailable">
              <option value="TRUE">موجود</option>
              <option value="FALSE">ناموجود</option>
            </select>
          </div>
        </div>
        <div class="field" style="margin-top: 12px;">
          <label>توضیحات کوتاه</label>
          <textarea id="fDesc" rows="2" placeholder="توضیح مختصر درباره طعم یا ترکیبات..."></textarea>
        </div>
        <div class="actions">
          <button type="submit" class="btn-primary" id="submitBtn">ذخیره آیتم</button>
          <button type="button" class="btn-ghost" id="cancelEditBtn" style="display: none;" onclick="resetForm()">انصراف از ویرایش</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h3>لیست آیتم‌های ثبت‌شده در گوگل شیت</h3>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>نام</th>
              <th>دسته</th>
              <th>قیمت</th>
              <th>برچسب</th>
              <th>موجودی</th>
              <th>عملیات</th>
            </tr>
          </thead>
          <tbody id="itemsBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";
    const ADMIN_PASS = "1234";

    let items = [];

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { t.style.display = "none"; }, 2800);
    }

    function checkLogin() {
      const val = document.getElementById("passInput").value;
      if (val === ADMIN_PASS) {
        sessionStorage.setItem("cafe_admin_auth", "1");
        showApp();
      } else {
        showToast("رمز عبور اشتباه است");
      }
    }

    function logout() {
      sessionStorage.removeItem("cafe_admin_auth");
      location.reload();
    }

    function showApp() {
      document.getElementById("loginScreen").style.display = "none";
      document.getElementById("appScreen").style.display = "block";
      fetchItems();
    }

    if (sessionStorage.getItem("cafe_admin_auth") === "1") {
      showApp();
    }

    async function apiPost(payload) {
      const res = await fetch(APPS_SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || "خطا در انجام عملیات");
      return data;
    }

    async function fetchItems() {
      document.getElementById("countInfo").textContent = "در حال دریافت اطلاعات...";
      try {
        const res = await fetch(APPS_SCRIPT_URL, { cache: "no-store" });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "خطا در خواندن شیت");
        items = data.items || [];
        document.getElementById("countInfo").textContent = `${items.length} آیتم در شیت ثبت شده`;
        renderTable();
      } catch (err) {
        showToast("خطا: " + err.message);
      }
    }

    function renderTable() {
      const tbody = document.getElementById("itemsBody");
      if (!items.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:var(--muted);">هنوز آیتمی ثبت نشده</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(it => {
        const avail = Boolean(it.available);
        return `
          <tr>
            <td><strong>${it.name}</strong></td>
            <td>${it.category || "-"}</td>
            <td>${Number(it.price || 0).toLocaleString("fa-IR")} تومان</td>
            <td>${it.badge || "-"}</td>
            <td><span class="pill ${avail ? "on" : "off"}">${avail ? "موجود" : "ناموجود"}</span></td>
            <td>
              <div class="row-btns">
                <button class="btn-ok" onclick="toggleStock('${it.id}', ${!avail})">
                  ${avail ? "ناموجود کن" : "موجود کن"}
                </button>
                <button class="btn-warn" onclick="startEdit('${it.id}')">ویرایش</button>
                <button class="btn-bad" onclick="deleteItem('${it.id}', '${String(it.name).replace(/'/g, "")}')">حذف</button>
              </div>
            </td>
          </tr>
        `;
      }).join("");
    }

    function startEdit(id) {
      const it = items.find(x => String(x.id) === String(id));
      if (!it) return;
      document.getElementById("editId").value = it.id;
      document.getElementById("fName").value = it.name || "";
      document.getElementById("fCategory").value = it.category || "";
      document.getElementById("fPrice").value = it.price || 0;
      document.getElementById("fBadge").value = it.badge || "";
      document.getElementById("fImage").value = it.image || "";
      document.getElementById("fAvailable").value = it.available ? "TRUE" : "FALSE";
      document.getElementById("fDesc").value = it.desc || "";
      document.getElementById("formTitle").textContent = `ویرایش: ${it.name}`;
      document.getElementById("submitBtn").textContent = "ثبت تغییرات";
      document.getElementById("cancelEditBtn").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function resetForm() {
      document.getElementById("itemForm").reset();
      document.getElementById("editId").value = "";
      document.getElementById("formTitle").textContent = "افزودن آیتم جدید";
      document.getElementById("submitBtn").textContent = "ذخیره آیتم";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    document.getElementById("itemForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;

      const editId = document.getElementById("editId").value;
      const payloadData = {
        name: document.getElementById("fName").value.trim(),
        category: document.getElementById("fCategory").value.trim(),
        price: Number(document.getElementById("fPrice").value) || 0,
        badge: document.getElementById("fBadge").value.trim(),
        image: document.getElementById("fImage").value.trim(),
        available: document.getElementById("fAvailable").value === "TRUE",
        desc: document.getElementById("fDesc").value.trim()
      };

      try {
        if (editId) {
          await apiPost({ action: "update", id: editId, data: payloadData });
          showToast("آیتم با موفقیت ویرایش شد");
        } else {
          await apiPost({ action: "add", data: payloadData });
          showToast("آیتم جدید اضافه شد");
        }
        resetForm();
        await fetchItems();
      } catch (err) {
        showToast("خطا: " + err.message);
      } finally {
        btn.disabled = false;
      }
    });

    async function toggleStock(id, nextState) {
      try {
        await apiPost({ action: "update", id, data: { available: nextState } });
        showToast("وضعیت موجودی آپدیت شد");
        await fetchItems();
      } catch (err) {
        showToast("خطا: " + err.message);
      }
    }

    async function deleteItem(id, name) {
      if (!confirm(`آیتم «${name}» حذف شود؟`)) return;
      try {
        await apiPost({ action: "delete", id });
        showToast("آیتم حذف شد");
        await fetchItems();
      } catch (err) {
        showToast("خطا: " + err.message);
      }
    }
  </script>
</body>
</html>
